<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attention Mechanism — Bottleneck vs Cosine</title>
<style>
html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.15);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{
  --bg:#0c0b09; --bg2:#1a1714;
  --ink:#f0ede6; --ink2:#b8b4aa; --ink3:#888580;
  --bdr:rgba(255,255,255,.10);
  --bot-bg:#2e0a0a; --bot-bd:#dc2626; --bot-h:#fca5a5; --bot-s:#f87171;
  --attn-bg:#2e1407; --attn-bd:#EA580C; --attn-h:#fdba74; --attn-s:#f97316;
  --enc-bg:#0d1a2e; --enc-bd:#2563EB; --enc-h:#93c5fd; --enc-s:#60a5fa;
  --dec-bg:#0d261a; --dec-bd:#059669; --dec-h:#6ee7b7; --dec-s:#34d399;
  --out-bg:#1f1a07; --out-bd:#D97706; --out-h:#fcd34d; --out-s:#f59e0b;
  background:var(--bg); color:var(--ink);
  font-family:'DM Mono',monospace,sans-serif; min-height:100%
}
body.light{
  --bg:#f5f3ef; --bg2:#ffffff; --ink:#1a1714; --ink2:#44403c; --ink3:#78716c;
  --bdr:rgba(0,0,0,.12);
  --bot-bg:#fee2e2; --bot-bd:#b91c1c; --bot-h:#7f1d1d; --bot-s:#dc2626;
  --attn-bg:#ffedd5; --attn-bd:#C2410C; --attn-h:#7c2d12; --attn-s:#f97316;
  --enc-bg:#dbeafe; --enc-bd:#1D4ED8; --enc-h:#1e3a8a; --enc-s:#3b82f6;
  --dec-bg:#d1fae5; --dec-bd:#047857; --dec-h:#064e3b; --dec-s:#10b981;
  --out-bg:#fef3c7; --out-bd:#B45309; --out-h:#78350f; --out-s:#d97706;
}
.theme-btn{position:fixed;top:16px;right:18px;z-index:999;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--bdr);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
<div style="width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 4px">
  <div style="display:flex;align-items:center;gap:0;margin-bottom:24px">
    <div style="flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,#dc2626,#EA580C);opacity:.65"></div>
    <span style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);padding:0 18px;white-space:nowrap">ATTENTION — BOTTLENECK vs COSINE SIMILARITY</span>
    <div style="flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,#EA580C,#dc2626);opacity:.65"></div>
  </div>

  <svg viewBox="0 0 1060 440" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mh-bot" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-enc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-attn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-dec" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="glow-attn"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Subtitle -->
  <text x="530" y="18" text-anchor="middle" font-size="11" fill="var(--ink3)" font-family="DM Mono,monospace">Fixed bottleneck h_T → val PPL ~22 &nbsp;·&nbsp; Cosine attention context_t → val PPL ~19 (−13.6%)</text>

  <!-- CENTER DIVIDER -->
  <line x1="530" y1="34" x2="530" y2="410" stroke="var(--bdr)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="530" y="30" text-anchor="middle" font-size="11" fill="var(--ink3)" font-family="DM Mono,monospace">vs</text>

  <!-- ═══════════ LEFT: NO ATTENTION ═══════════ -->
  <text x="265" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bot-h)" font-family="DM Mono,monospace">Without Attention (Bottleneck)</text>

  <!-- Encoder states — h_1..h_T shown, h_1..h_{T-1} faded (discarded) -->
  <g data-tip="Encoder states h_1..h_{T-1}: computed but DISCARDED without attention. All intermediate encoder states are thrown away. The information from source tokens 1..T-1 can only reach the decoder through whatever survived into h_T.">
    <rect x="46" y="88" width="64" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1" opacity=".4"/>
    <text x="78" y="113" text-anchor="middle" font-size="13" fill="var(--enc-h)" font-family="DM Mono,monospace" opacity=".45">h_1</text>
  </g>
  <g data-tip="Encoder states h_1..h_{T-1}: computed but DISCARDED without attention.">
    <rect x="120" y="88" width="64" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1" opacity=".4"/>
    <text x="152" y="113" text-anchor="middle" font-size="13" fill="var(--enc-h)" font-family="DM Mono,monospace" opacity=".45">h_2</text>
  </g>
  <g data-tip="Encoder states h_1..h_{T-1}: computed but DISCARDED without attention.">
    <rect x="194" y="88" width="64" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1" opacity=".4"/>
    <text x="226" y="113" text-anchor="middle" font-size="13" fill="var(--enc-h)" font-family="DM Mono,monospace" opacity=".4">…</text>
  </g>
  <!-- h_T — the only survivor, full opacity -->
  <g data-tip="h_T: the ONLY encoder state used by the decoder. Must encode the entire source sentence into this single fixed-size vector. For longer sentences this is the primary capacity bottleneck — early token information gets diluted or overwritten by later tokens during the sequential RNN pass.">
    <rect x="276" y="78" width="96" height="62" rx="7" fill="var(--bot-bg)" stroke="var(--bot-bd)" stroke-width="2"/>
    <text x="324" y="100" text-anchor="middle" font-size="11" letter-spacing=".1em" fill="var(--bot-s)" font-family="DM Mono,monospace">BOTTLENECK</text>
    <text x="324" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="var(--bot-h)" font-family="DM Mono,monospace">h_T</text>
    <text x="324" y="135" text-anchor="middle" font-size="11" fill="var(--bot-s)" font-family="DM Mono,monospace">fixed H-dim</text>
  </g>

  <!-- Discarded states X marker -->
  <line x1="46" y1="148" x2="268" y2="148" stroke="var(--bot-bd)" stroke-width="1" opacity=".5"/>
  <text x="158" y="167" text-anchor="middle" font-size="11" fill="var(--bot-s)" font-family="DM Mono,monospace">⚠ h_1..h_{T-1} discarded</text>

  <!-- h_T → Decoder (bottleneck) — single arrow, same context for all steps -->
  <g data-tip="Fixed context: h_T used identically at every decode step. No mechanism to focus on relevant source positions. The decoder generates token 1, token 2, ... with exactly the same source context each time.">
    <rect x="134" y="210" width="380" height="52" rx="7" fill="var(--bot-bg)" stroke="var(--bot-bd)" stroke-width="1" stroke-dasharray="4,3" opacity=".8"/>
    <text x="324" y="233" text-anchor="middle" font-size="12" fill="var(--bot-s)" font-family="DM Mono,monospace">Decode step 1 → 2 → 3 → … → T</text>
    <text x="324" y="252" text-anchor="middle" font-size="11" fill="var(--bot-s)" font-family="DM Mono,monospace">context = h_T (same at every step)</text>
  </g>
  <line x1="324" y1="140" x2="324" y2="210" stroke="var(--bot-bd)" stroke-width="2" marker-end="url(#mh-bot)"/>

  <!-- Equation card — left -->
  <rect x="80" y="300" width="388" height="52" rx="8" fill="var(--bot-bg)" stroke="var(--bot-bd)" stroke-width="1.5"/>
  <text x="274" y="320" text-anchor="middle" font-size="12" fill="var(--bot-h)" font-family="DM Mono,monospace">context = h_T  (constant)</text>
  <text x="274" y="340" text-anchor="middle" font-size="11" fill="var(--bot-s)" font-family="DM Mono,monospace">val PPL ~22 (LSTM, no attention)</text>

  <!-- ═══════════ RIGHT: COSINE ATTENTION ═══════════ -->
  <text x="795" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="var(--attn-h)" font-family="DM Mono,monospace">With Cosine Attention (Dynamic Context)</text>

  <!-- All encoder states accessible — full opacity -->
  <g data-tip="h_1: encoder state at position 1. Fully accessible as a key and value via attention. The decoder can retrieve it with any weight from 0 to 1 at any decode step.">
    <rect x="556" y="88" width="64" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1.5"/>
    <text x="588" y="113" text-anchor="middle" font-size="13" fill="var(--enc-h)" font-family="DM Mono,monospace">h_1</text>
  </g>
  <g data-tip="h_2: encoder state at position 2. All T states are retained as the key-value bank for the attention mechanism.">
    <rect x="632" y="88" width="64" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1.5"/>
    <text x="664" y="113" text-anchor="middle" font-size="13" fill="var(--enc-h)" font-family="DM Mono,monospace">h_2</text>
  </g>
  <g data-tip="h_T: final encoder state. Accessible like all others — no longer privileged.">
    <rect x="708" y="88" width="64" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1.5"/>
    <text x="740" y="113" text-anchor="middle" font-size="13" fill="var(--enc-h)" font-family="DM Mono,monospace">h_T</text>
  </g>
  <g data-tip="All T encoder states retained as key-value bank: encoder_outputs ∈ R^(N,T,H). The attention mechanism can retrieve any weighted combination of these at each decode step.">
    <rect x="784" y="88" width="48" height="42" rx="6" fill="var(--enc-bg)" stroke="var(--enc-bd)" stroke-width="1.5"/>
    <text x="808" y="113" text-anchor="middle" font-size="13" fill="var(--enc-s)" font-family="DM Mono,monospace">…</text>
  </g>

  <!-- "All states retained" label -->
  <text x="693" y="150" text-anchor="middle" font-size="11" fill="var(--enc-s)" font-family="DM Mono,monospace">✓ all T states retained as keys &amp; values</text>

  <!-- Cosine Attention node — KEY novel, glow -->
  <g data-tip="Cosine Attention: (1) Query: reshape decoder hidden h_dec from (1,N,H) → (N,1,H). (2) Score: cosine_similarity(h_dec, encoder_outputs, dim=-1) → (N,T). Cosine normalizes both vectors by L2 norm — alignment depends on direction only, not magnitude. This prevents early-training magnitude collapse where high-magnitude encoder states dominate regardless of semantic content. (3) Weights: α = softmax(scores) ∈ (N,T). (4) Context: context = α.unsqueeze(1).bmm(encoder_outputs) → (N,1,H). Fresh at every decode step." filter="url(#glow-attn)">
    <rect x="566" y="178" width="268" height="82" rx="9" fill="var(--attn-bg)" stroke="var(--attn-bd)" stroke-width="2.5"/>
    <text x="700" y="200" text-anchor="middle" font-size="11" letter-spacing=".1em" fill="var(--attn-s)" font-family="DM Mono,monospace">COSINE ATTENTION</text>
    <text x="700" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="var(--attn-h)" font-family="DM Mono,monospace">α = softmax( cos(h_dec, H) )</text>
    <text x="700" y="238" text-anchor="middle" font-size="11" fill="var(--attn-s)" font-family="DM Mono,monospace">cos(q,k) = (q·k) / (‖q‖·‖k‖)</text>
    <text x="700" y="253" text-anchor="middle" font-size="11" fill="var(--attn-s)" font-family="DM Mono,monospace">magnitude-invariant · direction-only</text>
  </g>

  <!-- All encoder states → attention (fan in from above) -->
  <line x1="588" y1="130" x2="620" y2="178" stroke="var(--enc-bd)" stroke-width="1.5" marker-end="url(#mh-enc)"/>
  <line x1="664" y1="130" x2="672" y2="178" stroke="var(--enc-bd)" stroke-width="1.5" marker-end="url(#mh-enc)"/>
  <line x1="740" y1="130" x2="726" y2="178" stroke="var(--enc-bd)" stroke-width="1.5" marker-end="url(#mh-enc)"/>
  <line x1="808" y1="130" x2="784" y2="178" stroke="var(--enc-bd)" stroke-width="1.5" marker-end="url(#mh-enc)"/>

  <!-- h_dec (decoder query) node -->
  <g data-tip="h_dec: current decoder hidden state (1,N,H) reshaped to (N,1,H). This is the QUERY in attention — it represents 'what the decoder is looking for' at the current generation step. As the decoder generates each token, h_dec changes, and so the attention distribution α changes, directing attention to different source positions.">
    <rect x="880" y="188" width="100" height="62" rx="7" fill="var(--dec-bg)" stroke="var(--dec-bd)" stroke-width="1.5"/>
    <text x="930" y="208" text-anchor="middle" font-size="11" letter-spacing=".06em" fill="var(--dec-s)" font-family="DM Mono,monospace">QUERY</text>
    <text x="930" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="var(--dec-h)" font-family="DM Mono,monospace">h_dec</text>
    <text x="930" y="244" text-anchor="middle" font-size="11" fill="var(--dec-s)" font-family="DM Mono,monospace">(N,1,H)</text>
  </g>
  <!-- h_dec → cosine attention -->
  <line x1="880" y1="219" x2="834" y2="219" stroke="var(--dec-bd)" stroke-width="1.5" marker-end="url(#mh-attn)"/>

  <!-- context_t output node -->
  <g data-tip="context_t = α · encoder_outputs: weighted sum of all encoder states using attention weights α. Shape (N,1,H). Changes at every decode step — the decoder dynamically retrieves what it needs from the source. Concatenated with embedded input token, projected via Linear→Tanh to emb_size, then fed to the recurrent layer.">
    <rect x="590" y="300" width="220" height="56" rx="7" fill="var(--attn-bg)" stroke="var(--attn-bd)" stroke-width="2"/>
    <text x="700" y="320" text-anchor="middle" font-size="11" letter-spacing=".06em" fill="var(--attn-s)" font-family="DM Mono,monospace">DYNAMIC CONTEXT</text>
    <text x="700" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="var(--attn-h)" font-family="DM Mono,monospace">context_t = α · H</text>
  </g>
  <line x1="700" y1="260" x2="700" y2="300" stroke="var(--attn-bd)" stroke-width="2" marker-end="url(#mh-attn)"/>

  <!-- Equation card — right -->
  <rect x="592" y="390" width="388" height="32" rx="8" fill="var(--attn-bg)" stroke="var(--attn-bd)" stroke-width="1.5"/>
  <text x="786" y="411" text-anchor="middle" font-size="11" fill="var(--attn-s)" font-family="DM Mono,monospace">val PPL ~19 (−13.6% vs LSTM no-attention)</text>

  <text x="1044" y="430" text-anchor="end" font-size="9" fill="var(--ink3)" font-family="DM Mono,monospace">meetdoshi.me · Neural Machine Translation</text>
  </svg>

  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:14px;margin-top:4px;border-top:1px solid var(--bdr);font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3)">
    <div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:2px;background:#dc2626"></div>Bottleneck (no attention)</div>
    <div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:2px;background:#2563EB"></div>Encoder states (keys+values)</div>
    <div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:2px;background:#EA580C"></div>Cosine attention + context (novel)</div>
    <div style="display:flex;align-items:center;gap:5px"><div style="width:9px;height:9px;border-radius:2px;background:#059669"></div>Decoder query h_dec</div>
    <span style="margin-left:auto;font-size:9px;color:var(--ink3)">Cosine normalizes magnitude → direction-only alignment</span>
  </div>
</div>

<div id="tp" style="display:none;position:fixed;max-width:256px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:10px 13px;font-size:10px;color:var(--ink2);line-height:1.7;z-index:200;pointer-events:none;font-family:'DM Mono',monospace;white-space:normal;word-break:break-word;box-shadow:0 8px 32px rgba(0,0,0,.5)"></div>

<script>
const tp=document.getElementById('tp'),PAD=14;
document.querySelectorAll('[data-tip]').forEach(el=>{
  el.style.cursor='default';
  el.addEventListener('mouseenter',e=>{tp.textContent=el.dataset.tip;tp.style.left='-9999px';tp.style.top='-9999px';tp.style.display='block'});
  el.addEventListener('mousemove',e=>{
    const tw=tp.offsetWidth,th=tp.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,cx=e.clientX,cy=e.clientY;
    let left=cx+PAD,top=cy-th-PAD;
    if(left+tw>vw-8)left=cx-tw-PAD;if(top<8)top=cy+PAD;
    if(left<8)left=8;if(left+tw>vw-8)left=vw-tw-8;
    if(top<8)top=8;if(top+th>vh-8)top=vh-th-8;
    tp.style.left=left+'px';tp.style.top=top+'px'
  });
  el.addEventListener('mouseleave',()=>{tp.style.display='none'});
});
let dark=true;
function toggleTheme(){dark=!dark;document.body.className=dark?'':'light';document.getElementById('themeBtn').textContent=dark?'🌙':'☀️'}
if(window.matchMedia('(prefers-color-scheme: light)').matches)toggleTheme();
</script>

<script>
(function(){
  function sendHeight(){
    var h = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
    window.parent.postMessage({ type:'iframeResize', h:h }, '*');
  }
  // Fire after load + short delay (handles JS-rendered SVG content)
  window.addEventListener('load', function(){ setTimeout(sendHeight, 150); });
  // Re-fire on any layout change (theme toggle, tooltip open, window resize)
  if(window.ResizeObserver){
    new ResizeObserver(sendHeight).observe(document.documentElement);
  }
})();
</script>

</body>
</html>
