<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LSTM Cell — Gate Structure</title>
<style>
html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.15);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{
  --bg:#0c0b09; --bg2:#1a1714;
  --ink:#f0ede6; --ink2:#b8b4aa; --ink3:#888580;
  --bdr:rgba(255,255,255,.10); --sh:0 2px 8px rgba(0,0,0,.6);
  /* forget gate — royal blue */
  --fg-bg:#0d1a2e; --fg-bd:#2563EB; --fg-h:#93c5fd; --fg-s:#60a5fa;
  /* input gate — emerald */
  --ig-bg:#0d261a; --ig-bd:#059669; --ig-h:#6ee7b7; --ig-s:#34d399;
  /* cell gate — amber */
  --cg-bg:#1f1a07; --cg-bd:#D97706; --cg-h:#fcd34d; --cg-s:#f59e0b;
  /* output gate — hot pink */
  --og-bg:#2e0f1f; --og-bd:#DB2777; --og-h:#f9a8d4; --og-s:#ec4899;
  /* cell state highway — sky blue (KEY — gets glow) */
  --cs-bg:#0f1f2e; --cs-bd:#0284C7; --cs-h:#7dd3fc; --cs-s:#38bdf8;
  /* h_t output — violet */
  --ht-bg:#180d2e; --ht-bd:#7B35CC; --ht-h:#c090ff; --ht-s:#a070e8;
  background:var(--bg); color:var(--ink);
  font-family:'DM Mono',monospace,sans-serif; min-height:100%
}
body.light{
  --bg:#f5f3ef; --bg2:#ffffff; --ink:#1a1714; --ink2:#44403c; --ink3:#78716c;
  --bdr:rgba(0,0,0,.12); --sh:0 2px 8px rgba(0,0,0,.10);
  --fg-bg:#dbeafe; --fg-bd:#1D4ED8; --fg-h:#1e3a8a; --fg-s:#3b82f6;
  --ig-bg:#d1fae5; --ig-bd:#047857; --ig-h:#064e3b; --ig-s:#10b981;
  --cg-bg:#fef3c7; --cg-bd:#B45309; --cg-h:#78350f; --cg-s:#d97706;
  --og-bg:#fce7f3; --og-bd:#BE185D; --og-h:#831843; --og-s:#ec4899;
  --cs-bg:#e0f2fe; --cs-bd:#0369A1; --cs-h:#0c4a6e; --cs-s:#0ea5e9;
  --ht-bg:#ede9fe; --ht-bd:#7C3AED; --ht-h:#5b21b6; --ht-s:#8b5cf6;
}
.theme-btn{position:fixed;top:16px;right:18px;z-index:999;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--bdr);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
.theme-btn:hover{transform:scale(1.08)}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
<!--
LAYOUT PLAN — no crossing lines:
  viewBox: 0 0 960 500
  Cell highway y=94, x from 36 to 924
  c_{t-1} circle at x=36, c_t at x=924
  
  Gate column centers: f=168, i=358, g=548, o=738
  Gate boxes: top y=168, height=130 each (include equation)
  Gate box left edge = cx-90, right = cx+90, so width=180
  
  x_t circle at (36,380), h_{t-1} circle at (36,438)
  Fan lines: simple straight diagonals from each input circle
  to the bottom of each gate box — NO horizontal rails → no crossings
  
  Operator nodes ON highway:
    ⊗ forget: x=168, y=94 (forget × c_{t-1})
    ⊗ i×g:    x=453, y=148 (between i and g cols, below highway)
    ⊕ add:    x=548, y=94 (c_{t-1}·f + i·g)
  
  tanh(c_t) box: x=800..880, y=112..148
  ⊗ output: x=820, y=260 (o_t × tanh(c_t))
  h_t: exits at (900, 260)
  h_t feedback arrow: curves BELOW all gate boxes → loops back
-->
<div style="width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 4px">
  <div style="display:flex;align-items:center;gap:0;margin-bottom:24px">
    <div style="flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,#0284C7,#059669,#D97706,#DB2777);opacity:.65"></div>
    <span style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);padding:0 18px;white-space:nowrap">LSTM CELL — GATE STRUCTURE</span>
    <div style="flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,#DB2777,#D97706,#059669,#0284C7);opacity:.65"></div>
  </div>

  <svg viewBox="0 0 960 510" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mh-fg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-ig" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-cg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-og" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-cs" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-ht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#7B35CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mh-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1.5 L7,4.5 L1,7.5" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <!-- filterUnits=userSpaceOnUse + explicit region: horizontal lines have zero height
         in objectBoundingBox coords → filter collapses. userSpaceOnUse with fixed y
         range avoids that. -->
    <filter id="glow-cs" filterUnits="userSpaceOnUse" x="0" y="74" width="960" height="40">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Subtitle -->
  <text x="480" y="18" text-anchor="middle" font-size="11" fill="var(--ink3)" font-family="DM Mono,monospace">16 nn.Parameter tensors · 8 weight matrices (Xavier) + 8 bias vectors (zeros) · manual gating arithmetic</text>

  <!-- ═══ CELL STATE HIGHWAY y=94 ═══ -->
  <!-- Left: c_{t-1} terminus -->
  <circle cx="36" cy="94" r="10" fill="var(--cs-bg)" stroke="var(--cs-bd)" stroke-width="2"/>
  <text x="36" y="72" text-anchor="middle" font-size="11" fill="var(--cs-h)" font-family="DM Mono,monospace">c_{t-1}</text>
  <!-- Right: c_t terminus -->
  <circle cx="924" cy="94" r="10" fill="var(--cs-bg)" stroke="var(--cs-bd)" stroke-width="2"/>
  <text x="924" y="72" text-anchor="middle" font-size="11" fill="var(--cs-h)" font-family="DM Mono,monospace">c_t</text>

  <!-- Highway segments — each line gets the filter individually so userSpaceOnUse
       bounding box is per-segment, guaranteeing glow on all three. -->
  <!-- Segment 1: c_{t-1} → ⊗f -->
  <line x1="46"  y1="94" x2="155" y2="94" stroke="var(--cs-bd)" stroke-width="3.5" filter="url(#glow-cs)"/>
  <!-- Segment 2: ⊗f → ⊕ -->
  <line x1="181" y1="94" x2="534" y2="94" stroke="var(--cs-bd)" stroke-width="3.5" filter="url(#glow-cs)"/>
  <!-- Segment 3: ⊕ → c_t (was missing because group height=0 collapsed objectBoundingBox) -->
  <line x1="562" y1="94" x2="914" y2="94" stroke="var(--cs-bd)" stroke-width="3.5" filter="url(#glow-cs)"/>

  <!-- Highway equation label -->
  <text x="480" y="78" text-anchor="middle" font-size="11" fill="var(--cs-h)" font-family="DM Mono,monospace">c_t = f_t ⊙ c_{t-1}  +  i_t ⊙ g_t</text>

  <!-- ⊗ on highway: forget gate prunes c_{t-1} -->
  <g data-tip="f_t ⊙ c_{t-1}: element-wise multiply. Forget gate output (0,1) scales old cell state. When f_t≈1: old memory flows unchanged. When f_t≈0: old memory is erased. The ADDITIVE path (not the multiplicative one) is what enables long-range gradient flow.">
    <circle cx="168" cy="94" r="13" fill="var(--bg)" stroke="var(--fg-bd)" stroke-width="2.5"/>
    <text x="168" y="100" text-anchor="middle" font-size="16" fill="var(--fg-h)" font-family="DM Mono,monospace">⊗</text>
  </g>

  <!-- ⊗ between ig and cg: i_t × g_t, positioned below highway at y=148 -->
  <g data-tip="i_t ⊙ g_t: input gate scales candidate. Near-zero i_t → nothing written. Near-one i_t → full candidate added to cell state.">
    <circle cx="453" cy="150" r="13" fill="var(--bg)" stroke="var(--cg-bd)" stroke-width="2.5"/>
    <text x="453" y="156" text-anchor="middle" font-size="16" fill="var(--cg-h)" font-family="DM Mono,monospace">⊗</text>
  </g>

  <!-- ⊕ on highway: adds i_t⊙g_t to f_t⊙c_{t-1} -->
  <g data-tip="⊕ additive update: c_t = f_t⊙c_{t-1} + i_t⊙g_t. The addition is the critical design — gradients backpropagate through '+' without vanishing, giving the cell state a direct path for long-range gradient flow. This is what solves the vanishing gradient problem of plain RNN.">
    <circle cx="548" cy="94" r="14" fill="var(--bg)" stroke="var(--cs-bd)" stroke-width="2.5"/>
    <text x="548" y="101" text-anchor="middle" font-size="18" fill="var(--cs-h)" font-family="DM Mono,monospace">⊕</text>
  </g>

  <!-- Line from ⊗(i×g) up to ⊕ highway -->
  <line x1="453" y1="137" x2="453" y2="106" stroke="var(--cs-bd)" stroke-width="2"/>
  <line x1="453" y1="100" x2="534" y2="95" stroke="var(--cs-bd)" stroke-width="2" marker-end="url(#mh-cs)"/>

  <!-- ═══ GATE BOXES — 4 columns, y=170..310, no crossing ═══ -->

  <!-- FORGET GATE (cx=168) -->
  <g data-tip="Forget gate f_t: decides what to keep from old cell state. σ output ∈ (0,1) acts as a keep-ratio. When near 1: c_{t-1} passes through unchanged. When near 0: old memory erased. Implemented as two separate nn.Parameter weight matrices (W_if for input, W_hf for hidden) + two biases.">
    <rect x="78" y="170" width="180" height="140" rx="8" fill="var(--fg-bg)" stroke="var(--fg-bd)" stroke-width="2"/>
    <text x="168" y="192" text-anchor="middle" font-size="11" letter-spacing=".12em" fill="var(--fg-s)" font-family="DM Mono,monospace">FORGET GATE</text>
    <text x="168" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg-h)" font-family="DM Mono,monospace">f_t</text>
    <text x="168" y="236" text-anchor="middle" font-size="11" fill="var(--fg-s)" font-family="DM Mono,monospace">σ(x_t·W_if + b_if</text>
    <text x="168" y="252" text-anchor="middle" font-size="11" fill="var(--fg-s)" font-family="DM Mono,monospace"> + h_{t-1}·W_hf + b_hf)</text>
    <text x="168" y="272" text-anchor="middle" font-size="11" fill="var(--fg-h)" font-family="DM Mono,monospace">output ∈ (0, 1)</text>
    <text x="168" y="288" text-anchor="middle" font-size="11" fill="var(--fg-s)" font-family="DM Mono,monospace">keep ratio for c_{t-1}</text>
    <text x="168" y="304" text-anchor="middle" font-size="11" fill="var(--fg-s)" font-family="DM Mono,monospace"> </text>
  </g>
  <!-- f_t → ⊗ highway (vertical up from top of box) -->
  <line x1="168" y1="170" x2="168" y2="107" stroke="var(--fg-bd)" stroke-width="2" marker-end="url(#mh-fg)"/>

  <!-- INPUT GATE (cx=358) -->
  <g data-tip="Input gate i_t: controls how much of the candidate g_t gets written into cell state. Works jointly with cell gate: actual write = i_t ⊙ g_t. Two nn.Parameter pairs: W_ii (input→gate), W_hi (hidden→gate), plus two biases.">
    <rect x="268" y="170" width="180" height="140" rx="8" fill="var(--ig-bg)" stroke="var(--ig-bd)" stroke-width="2"/>
    <text x="358" y="192" text-anchor="middle" font-size="11" letter-spacing=".12em" fill="var(--ig-s)" font-family="DM Mono,monospace">INPUT GATE</text>
    <text x="358" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ig-h)" font-family="DM Mono,monospace">i_t</text>
    <text x="358" y="236" text-anchor="middle" font-size="11" fill="var(--ig-s)" font-family="DM Mono,monospace">σ(x_t·W_ii + b_ii</text>
    <text x="358" y="252" text-anchor="middle" font-size="11" fill="var(--ig-s)" font-family="DM Mono,monospace"> + h_{t-1}·W_hi + b_hi)</text>
    <text x="358" y="272" text-anchor="middle" font-size="11" fill="var(--ig-h)" font-family="DM Mono,monospace">output ∈ (0, 1)</text>
    <text x="358" y="288" text-anchor="middle" font-size="11" fill="var(--ig-s)" font-family="DM Mono,monospace">write gate</text>
    <text x="358" y="304" text-anchor="middle" font-size="11" fill="var(--ig-s)" font-family="DM Mono,monospace"> </text>
  </g>
  <!-- i_t → ⊗(i×g) -->
  <line x1="358" y1="170" x2="358" y2="162" stroke="var(--ig-bd)" stroke-width="2"/>
  <line x1="358" y1="158" x2="440" y2="152" stroke="var(--ig-bd)" stroke-width="2" marker-end="url(#mh-ig)"/>

  <!-- CELL GATE (cx=548) -->
  <g data-tip="Cell gate g_t (candidate): proposes new information using tanh, keeping values in (−1,1) to prevent unbounded cell state growth. Actual write = i_t ⊙ g_t — the input gate acts as a learned selector. Two nn.Parameter pairs: W_ig, W_hg, plus biases b_ig, b_hg.">
    <rect x="458" y="170" width="180" height="140" rx="8" fill="var(--cg-bg)" stroke="var(--cg-bd)" stroke-width="2"/>
    <text x="548" y="192" text-anchor="middle" font-size="11" letter-spacing=".12em" fill="var(--cg-s)" font-family="DM Mono,monospace">CELL GATE</text>
    <text x="548" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="var(--cg-h)" font-family="DM Mono,monospace">g_t  (candidate)</text>
    <text x="548" y="236" text-anchor="middle" font-size="11" fill="var(--cg-s)" font-family="DM Mono,monospace">tanh(x_t·W_ig + b_ig</text>
    <text x="548" y="252" text-anchor="middle" font-size="11" fill="var(--cg-s)" font-family="DM Mono,monospace"> + h_{t-1}·W_hg + b_hg)</text>
    <text x="548" y="272" text-anchor="middle" font-size="11" fill="var(--cg-h)" font-family="DM Mono,monospace">output ∈ (−1, 1)</text>
    <text x="548" y="288" text-anchor="middle" font-size="11" fill="var(--cg-s)" font-family="DM Mono,monospace">candidate value</text>
    <text x="548" y="304" text-anchor="middle" font-size="11" fill="var(--cg-s)" font-family="DM Mono,monospace"> </text>
  </g>
  <!-- g_t → ⊗(i×g) -->
  <line x1="548" y1="170" x2="548" y2="162" stroke="var(--cg-bd)" stroke-width="2"/>
  <line x1="548" y1="158" x2="466" y2="152" stroke="var(--cg-bd)" stroke-width="2" marker-end="url(#mh-cg)"/>

  <!-- OUTPUT GATE (cx=738) -->
  <g data-tip="Output gate o_t: controls what portion of cell state c_t is exposed as hidden state h_t. Separates memory storage (c_t, unbounded) from output readout (h_t, always ∈(−1,1) via tanh). This gating separation is the key architectural insight of LSTM. Two nn.Parameter pairs: W_io, W_ho, plus biases.">
    <rect x="648" y="170" width="180" height="140" rx="8" fill="var(--og-bg)" stroke="var(--og-bd)" stroke-width="2"/>
    <text x="738" y="192" text-anchor="middle" font-size="11" letter-spacing=".12em" fill="var(--og-s)" font-family="DM Mono,monospace">OUTPUT GATE</text>
    <text x="738" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="var(--og-h)" font-family="DM Mono,monospace">o_t</text>
    <text x="738" y="236" text-anchor="middle" font-size="11" fill="var(--og-s)" font-family="DM Mono,monospace">σ(x_t·W_io + b_io</text>
    <text x="738" y="252" text-anchor="middle" font-size="11" fill="var(--og-s)" font-family="DM Mono,monospace"> + h_{t-1}·W_ho + b_ho)</text>
    <text x="738" y="272" text-anchor="middle" font-size="11" fill="var(--og-h)" font-family="DM Mono,monospace">output ∈ (0, 1)</text>
    <text x="738" y="288" text-anchor="middle" font-size="11" fill="var(--og-s)" font-family="DM Mono,monospace">readout gate</text>
    <text x="738" y="304" text-anchor="middle" font-size="11" fill="var(--og-s)" font-family="DM Mono,monospace"> </text>
  </g>

  <!-- ═══ tanh(c_t) box — reads from highway end ═══ -->
  <g data-tip="tanh(c_t): squashes cell state to (−1,1) before output gate selects what to expose. Ensures h_t remains bounded even if c_t has accumulated large values. This squashing separates cell state magnitude from hidden state magnitude.">
    <rect x="810" y="112" width="100" height="36" rx="7" fill="var(--cs-bg)" stroke="var(--cs-bd)" stroke-width="1.5"/>
    <text x="860" y="134" text-anchor="middle" font-size="12" fill="var(--cs-h)" font-family="DM Mono,monospace">tanh(c_t)</text>
  </g>
  <!-- Drop from highway at x=860 -->
  <line x1="860" y1="94" x2="860" y2="112" stroke="var(--cs-bd)" stroke-width="2" marker-end="url(#mh-cs)"/>

  <!-- ⊗ final: o_t × tanh(c_t) = h_t -->
  <g data-tip="h_t = o_t ⊙ tanh(c_t): the hidden state output. Output gate selects which dimensions of the cell state to expose. This gated readout is what the decoder uses as context. h_t feeds both to the next LSTM step as h_{t-1} AND to the decoder projection layer.">
    <circle cx="860" cy="230" r="14" fill="var(--bg)" stroke="var(--og-bd)" stroke-width="2.5"/>
    <text x="860" y="237" text-anchor="middle" font-size="16" fill="var(--og-h)" font-family="DM Mono,monospace">⊗</text>
  </g>
  <!-- tanh(c_t) box → ⊗ -->
  <line x1="860" y1="148" x2="860" y2="216" stroke="var(--cs-bd)" stroke-width="2" marker-end="url(#mh-og)"/>
  <!-- o_t box top → ⊗ (left side of output gate top edge, going diagonally right to ⊗) -->
  <line x1="828" y1="170" x2="860" y2="216" stroke="var(--og-bd)" stroke-width="2" marker-end="url(#mh-og)"/>

  <!-- h_t exit -->
  <line x1="860" y1="244" x2="860" y2="278" stroke="var(--ht-bd)" stroke-width="2" marker-end="url(#mh-ht)"/>
  <g data-tip="h_t: hidden state output. Passed to: (1) the decoder at each generation step as source of attention query, (2) the next LSTM timestep as h_{t-1}. Shape (batch, hidden_dim). For the encoder, h_T[-1] (the final timestep hidden state) is extracted and projected for decoder initialization.">
    <circle cx="860" cy="288" r="10" fill="var(--ht-bg)" stroke="var(--ht-bd)" stroke-width="2"/>
    <text x="896" y="292" text-anchor="start" font-size="15" font-weight="700" fill="var(--ht-h)" font-family="DM Mono,monospace">h_t</text>
  </g>

  <!-- ═══ INPUT NODES: x_t and h_{t-1} — left side ═══ -->
  <g data-tip="x_t: current input token, embedded to dim (batch, emb_size). Connects to all four gate linear transformations via W_if, W_ii, W_ig, W_io weight matrices (Xavier initialized).">
    <circle cx="36" cy="360" r="10" fill="var(--bg)" stroke="var(--ink2)" stroke-width="1.5"/>
    <text x="36" y="348" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="DM Mono,monospace">x_t</text>
  </g>
  <g data-tip="h_{t-1}: previous hidden state, shape (batch, hidden_dim). Connects to all four gates via W_hf, W_hi, W_hg, W_ho weight matrices. Zero-initialized at t=0.">
    <circle cx="36" cy="420" r="10" fill="var(--bg)" stroke="var(--ink3)" stroke-width="1.5"/>
    <text x="36" y="408" text-anchor="middle" font-size="12" fill="var(--ink3)" font-family="DM Mono,monospace">h_{t-1}</text>
  </g>

  <!-- Fan lines from x_t (36,360) and h_{t-1} (36,420) → bottom of each gate box (y=310)
       Gate bottom centers: f=168, i=358, g=548, o=738
       No horizontal rail → simple diagonals, they don't cross because destination y=310 is above source y=360/420 -->
  <!-- x_t fans (solid, colored per gate) -->
  <line x1="46" y1="356" x2="120" y2="314" stroke="var(--fg-bd)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mh-fg)"/>
  <line x1="46" y1="358" x2="300" y2="314" stroke="var(--ig-bd)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mh-ig)"/>
  <line x1="46" y1="360" x2="490" y2="314" stroke="var(--cg-bd)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mh-cg)"/>
  <line x1="46" y1="362" x2="680" y2="314" stroke="var(--og-bd)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mh-og)"/>

  <!-- h_{t-1} fans (lighter dashes) -->
  <line x1="46" y1="416" x2="120" y2="316" stroke="var(--fg-bd)" stroke-width="1" stroke-dasharray="2,4" opacity=".7" marker-end="url(#mh-fg)"/>

<div id="tp" style="display:none;position:fixed;max-width:256px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:10px 13px;font-size:10px;color:var(--ink2);line-height:1.7;z-index:200;pointer-events:none;font-family:'DM Mono',monospace;white-space:normal;word-break:break-word;box-shadow:0 8px 32px rgba(0,0,0,.5)"></div>

<script>
const tp=document.getElementById('tp'),PAD=14;
document.querySelectorAll('[data-tip]').forEach(el=>{
  el.style.cursor='default';
  el.addEventListener('mouseenter',e=>{tp.textContent=el.dataset.tip;tp.style.left='-9999px';tp.style.top='-9999px';tp.style.display='block'});
  el.addEventListener('mousemove',e=>{
    const tw=tp.offsetWidth,th=tp.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,cx=e.clientX,cy=e.clientY;
    let left=cx+PAD,top=cy-th-PAD;
    if(left+tw>vw-8)left=cx-tw-PAD;if(top<8)top=cy+PAD;
    if(left<8)left=8;if(left+tw>vw-8)left=vw-tw-8;
    if(top<8)top=8;if(top+th>vh-8)top=vh-th-8;
    tp.style.left=left+'px';tp.style.top=top+'px'
  });
  el.addEventListener('mouseleave',()=>{tp.style.display='none'});
});
let dark=true;
function toggleTheme(){dark=!dark;document.body.className=dark?'':'light';document.getElementById('themeBtn').textContent=dark?'🌙':'☀️'}
if(window.matchMedia('(prefers-color-scheme: light)').matches)toggleTheme();
</script>

<script>
(function(){
  function sendHeight(){
    var h = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
    window.parent.postMessage({ type:'iframeResize', h:h }, '*');
  }
  // Fire after load + short delay (handles JS-rendered SVG content)
  window.addEventListener('load', function(){ setTimeout(sendHeight, 150); });
  // Re-fire on any layout change (theme toggle, tooltip open, window resize)
  if(window.ResizeObserver){
    new ResizeObserver(sendHeight).observe(document.documentElement);
  }
})();
</script>
